<script>
  document.querySelectorAll('.modal-toggle').forEach(function(checkbox) {
    checkbox.addEventListener('change', function() {
      // find the modal-overlay that comes AFTER the thumbnail label
      const overlay = checkbox.nextElementSibling.nextElementSibling;
      const video = overlay.querySelector('.modal-video');

      if (video) {
        if (checkbox.checked) {
          video.play();
        } else {
          video.pause();
          video.currentTime = 0;
        }
      }
    });
  });
</script>
